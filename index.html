<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)" />
  <title>Révisions d'histoire</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%238a3b12'/><path d='M14 50V22l18-10 18 10v28' fill='none' stroke='%23f6f1e7' stroke-width='4'/><path d='M22 50V28m10 22V28m10 22V28M10 50h44' stroke='%23f6f1e7' stroke-width='4'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f1e7; --surface: #fffdf8; --surface-2: #efe7d8; --ink: #2a2118; --muted: #74685a;
      --line: #e1d6c3; --accent: #8a3b12; --accent-ink: #fff; --accent-soft: #f3e2d4;
      --ok: #2f6b3a; --ok-soft: #e1efe1; --ko: #a3261c; --ko-soft: #f6e0dc;
      --radius: 14px; --shadow: 0 1px 2px rgba(60,40,20,.06), 0 6px 20px rgba(60,40,20,.06);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #16130f; --surface: #201b16; --surface-2: #2a241d; --ink: #f1e9dc; --muted: #a99c8b;
        --line: #3a3128; --accent: #e08a52; --accent-ink: #1b120b; --accent-soft: #3a2619;
        --ok: #7fc48a; --ok-soft: #1f3322; --ko: #f08a7e; --ko-soft: #3c1f1b;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
      }
    }
    :root[data-theme="dark"] {
      --bg: #16130f; --surface: #201b16; --surface-2: #2a241d; --ink: #f1e9dc; --muted: #a99c8b;
      --line: #3a3128; --accent: #e08a52; --accent-ink: #1b120b; --accent-soft: #3a2619;
      --ok: #7fc48a; --ok-soft: #1f3322; --ko: #f08a7e; --ko-soft: #3c1f1b;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg); color: var(--ink);
      font: 16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased; min-height: 100dvh;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    h1, h2, h3 { font-family: Fraunces, Georgia, serif; font-weight: 600; line-height: 1.2; margin: 0; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }

    header.top { padding: 20px 0 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    header.top h1 { font-size: 1.5rem; }
    header.top .sub { color: var(--muted); font-size: .85rem; }

    nav.tabs {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px);
      border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      display: flex; justify-content: center; gap: 4px;
    }
    nav.tabs button {
      flex: 1; max-width: 200px; background: none; border: 0; border-radius: 10px; padding: 8px 4px;
      display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .75rem; color: var(--muted);
    }
    nav.tabs button svg { width: 22px; height: 22px; }
    nav.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
    .section-title { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 22px 0 10px; font-weight: 600; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: .9rem;
      transition: background .15s, border-color .15s;
    }
    .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .chip small { opacity: .7; margin-left: 4px; }
    .btn {
      border: 0; border-radius: 12px; padding: 14px 18px; font-weight: 600; background: var(--accent); color: var(--accent-ink);
      width: 100%; font-size: 1rem;
    }
    .btn.secondary { background: var(--surface-2); color: var(--ink); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; }
    .hint { color: var(--muted); font-size: .85rem; margin: 8px 0 0; }

    /* Quiz */
    .progress { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: 6px 0 14px; }
    .progress > i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
    .q-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: .8rem; gap: 8px; }
    .badge { display: inline-block; font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .question { font-family: Fraunces, Georgia, serif; font-size: 1.3rem; margin: 10px 0 18px; line-height: 1.35; }
    .answers { display: grid; gap: 10px; }
    .answer {
      text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 16px;
      display: flex; gap: 12px; align-items: flex-start; transition: border-color .15s, background .15s;
    }
    .answer .k { flex: none; width: 26px; height: 26px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font-size: .8rem; font-weight: 600; color: var(--muted); }
    .answer:hover:not(:disabled) { border-color: var(--accent); }
    .answer.ok { border-color: var(--ok); background: var(--ok-soft); }
    .answer.ok .k { background: var(--ok); color: var(--surface); }
    .answer.ko { border-color: var(--ko); background: var(--ko-soft); }
    .answer.ko .k { background: var(--ko); color: var(--surface); }
    .answer:disabled { cursor: default; }
    .answer.dim { opacity: .55; }
    .feedback { margin-top: 14px; padding: 14px 16px; border-radius: 12px; border-left: 4px solid; }
    .feedback.ok { background: var(--ok-soft); border-color: var(--ok); }
    .feedback.ko { background: var(--ko-soft); border-color: var(--ko); }
    .feedback strong { display: block; margin-bottom: 4px; }

    /* Chronologie */
    .chrono-picked { display: grid; gap: 8px; min-height: 52px; margin-bottom: 12px; padding: 10px; border: 1.5px dashed var(--line); border-radius: 12px; }
    .chrono-picked:empty::before { content: "Touche les événements dans l'ordre, du plus ancien au plus récent"; color: var(--muted); font-size: .85rem; align-self: center; text-align: center; }
    .chrono-item { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; }
    .chrono-item .n { flex: none; width: 24px; height: 24px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: .8rem; font-weight: 600; }
    .chrono-item.ok { border-color: var(--ok); background: var(--ok-soft); }
    .chrono-item.ko { border-color: var(--ko); background: var(--ko-soft); }
    .chrono-pool { display: grid; gap: 8px; }

    /* Résultats */
    .score { text-align: center; padding: 24px 18px; }
    .score .big { font-family: Fraunces, Georgia, serif; font-size: 3rem; color: var(--accent); }
    .missed { display: grid; gap: 10px; margin-top: 10px; }
    .missed .card { padding: 14px; }
    .missed .q { font-weight: 600; margin-bottom: 4px; }
    .missed .a { color: var(--ok); }

    /* Fiches */
    details.fiche { margin-bottom: 10px; }
    details.fiche > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    details.fiche > summary::-webkit-details-marker { display: none; }
    details.fiche > summary h3 { font-size: 1.1rem; }
    details.fiche > summary .per { color: var(--muted); font-size: .8rem; white-space: nowrap; }
    details.fiche[open] > summary { margin-bottom: 12px; }
    .entry { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
    .entry .d { font-weight: 600; color: var(--accent); font-size: .9rem; }
    .entry p { margin: 0; }
    @media (max-width: 480px) { .entry { grid-template-columns: 1fr; gap: 2px; } }

    /* Progrès */
    .stat { display: grid; gap: 6px; padding: 12px 0; border-top: 1px solid var(--line); }
    .stat:first-child { border-top: 0; }
    .stat .lbl { display: flex; justify-content: space-between; gap: 10px; font-size: .95rem; }
    .stat .lbl span { color: var(--muted); font-size: .85rem; white-space: nowrap; }
    .bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; display: flex; }
    .bar .g { background: var(--ok); } .bar .r { background: var(--ko); }
    .legend { display: flex; gap: 14px; font-size: .8rem; color: var(--muted); margin-top: 8px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    .link { background: none; border: 0; color: var(--accent); padding: 0; text-decoration: underline; text-underline-offset: 3px; font-size: .9rem; }
    .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <h1>Révisions d'histoire</h1>
        <div class="sub" id="sub"></div>
      </div>
    </header>
    <main id="app"></main>
  </div>

  <nav class="tabs" aria-label="Navigation">
    <button data-tab="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9a3 3 0 1 1 4 2.8c-.7.3-1 .9-1 1.6V14"/><circle cx="12" cy="17.5" r=".6" fill="currentColor"/><circle cx="12" cy="12" r="9.5"/></svg>Réviser</button>
    <button data-tab="fiches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M8 7h8M8 11h6"/></svg>Fiches</button>
    <button data-tab="progres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progrès</button>
  </nav>

  <script src="fiches.js"></script>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
